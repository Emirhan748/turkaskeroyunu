<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oyun Sitem</title>
  <style>
    body {
      margin: 0;
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 48px;
      background: linear-gradient(135deg, #00f5ff, #7b2fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    p {
      color: #888;
      font-size: 18px;
    }
    .badge {
      margin-top: 32px;
      padding: 8px 20px;
      border: 1px solid #00f5ff44;
      border-radius: 4px;
      color: #00f5ff;
      font-size: 13px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <h1>🎮 Oyun Sitem</h1>
  <p>Site yakında burada olacak. Takipte kal!</p>
  <div class="badge">COMING SOON</div>
</body>
</html>
